<svg xmlns="http://www.w3.org/2000/svg" width="650" height="64" viewBox="0 0 650 64" role="img" aria-labelledby="title">
  <title id="title">Laravel · Next.js · React · Python</title>
  <style>
    .reveal { animation: typing 10s steps(34, end) infinite; }
    .caret { animation: follow 10s steps(34, end) infinite, blink 1s steps(2, end) infinite; }
    @keyframes typing { 0%, 5% { width: 0; } 45%, 85% { width: 514px; } 100% { width: 0; } }
    @keyframes follow { 0%, 5% { transform: translateX(0); } 45%, 85% { transform: translateX(514px); } 100% { transform: translateX(0); } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .reveal { animation: none; } .caret { display: none; } }
  </style>
  <defs>
    <clipPath id="typingClip"><rect class="reveal" x="0" y="0" width="514" height="64"/></clipPath>
  </defs>
  <g transform="translate(68 0)">
    <text x="0" y="42" fill="#4F8FF7" font-family="Consolas, Menlo, monospace" font-size="25" textLength="510" lengthAdjust="spacingAndGlyphs" clip-path="url(#typingClip)">Laravel · Next.js · React · Python</text>
    <rect class="caret" x="0" y="20" width="2" height="27" rx="1" fill="#4F8FF7"/>
  </g>
</svg>
